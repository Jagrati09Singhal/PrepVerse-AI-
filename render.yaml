# ==============================================================================
# PrepVerse AI — Free 1-Click Cloud Deployment Configuration (Render)
# Blueprint: Python Web Service hosting FastAPI Backend + React/Vite SPA
# ==============================================================================

services:
  - type: web
    name: prepverse-ai
    runtime: python
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: APP_NAME
        value: "PrepVerse AI"
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: deterministic
      - key: DATABASE_URL
        value: "sqlite:///./prepverse_dev.db"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSCODE
        value: "PrepVerseAdmin2026!"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: TAGLINE
        value: "Prepare Smarter. Practice Deeper. Become Interview-Ready."
